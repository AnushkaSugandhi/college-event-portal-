<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusBuzz — One Campus. Every Event.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#14132B;
  --ink-soft:#2A2850;
  --indigo:#4F3DF5;
  --indigo-deep:#3A2CD1;
  --violet:#8B5CF6;
  --cyan:#17B6C2;
  --yellow:#EAB308;
  --green:#16A34A;
  --red:#E11D48;
  --paper:#F6F5FC;
  --card:#FFFFFF;
  --line:#E7E4F6;
  --muted:#6B6792;
  --muted-2:#918CAE;
  --shadow: 0 1px 3px rgba(20,19,43,0.05), 0 8px 24px -8px rgba(20,19,43,0.08);
  --shadow-lg: 0 4px 12px rgba(20,19,43,0.06), 0 20px 44px -12px rgba(20,19,43,0.16);
  --radius: 18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:#D8D4F0;border-radius:8px;}
.container{max-width:1240px;margin:0 auto;padding:0 32px;}
@media(max-width:640px){.container{padding:0 18px;}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14.5px;border:none;transition:all .18s ease;white-space:nowrap;user-select:none;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--indigo);color:#fff;box-shadow:0 8px 20px -6px rgba(79,61,245,0.55);}
.btn-primary:hover{background:var(--indigo-deep);box-shadow:0 10px 24px -6px rgba(79,61,245,0.65);transform:translateY(-1px);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:var(--ink-soft);}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--indigo);color:var(--indigo);background:#FAF9FF;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent;}
.btn-ghost:hover{color:var(--ink);background:#EFEBFA;}
.btn-sm{padding:8px 15px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;}
.btn-danger{background:#FFF1F2;color:var(--red);border:1px solid #FFE4E6;}
.btn-danger:hover{background:#FFE4E6;}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;box-shadow:none !important;}

/* Back Navigation Button */
.nav-back-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
.nav-back-btn:hover{background:#F4F2FD;border-color:var(--indigo);color:var(--indigo);transform:translateX(-2px);}
.nav-back-btn svg{transition:transform .15s ease;}
.nav-back-btn:hover svg{transform:translateX(-2px);}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:24px;}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;}
.badge-indigo{background:#EEEBFE;color:var(--indigo-deep);}
.badge-cyan{background:#E2F7F9;color:#0B7882;}
.badge-yellow{background:#FEF9C3;color:#854D0E;}
.badge-green{background:#DCFCE7;color:#15803D;}
.badge-red{background:#FFE4E6;color:#BE123C;}
.badge-grey{background:#F0EEFA;color:var(--muted);}

/* Form Fields */
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,61,245,0.12);}
.field{margin-bottom:18px;}

/* Topnav */
.topnav{position:sticky;top:0;z-index:40;background:rgba(246,245,252,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-0.02em;user-select:none;}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 10px rgba(79,61,245,0.3);}

/* App Shell (Dashboard) */
.shell{display:flex;min-height:100vh;}
.sidebar{width:252px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#A9A5D6;font-size:14px;font-weight:500;margin-bottom:3px;cursor:pointer;transition:all .15s;}
.sidebar-link:hover{background:rgba(255,255,255,0.07);color:#fff;}
.sidebar-link.active{background:rgba(255,255,255,0.12);color:#fff;font-weight:600;}
.sidebar-link .ic{width:18px;display:flex;align-items:center;justify-content:center;}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,245,252,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.content{padding:28px 32px 80px;flex:1;}
@media(max-width:900px){.sidebar{display:none;} .content{padding:20px 16px 100px;} .topbar{padding:12px 16px;}}

/* Avatar */
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13.5px;flex-shrink:0;letter-spacing:-0.02em;}

/* Toast */
#toastHost{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
@media(max-width:640px){#toastHost{right:12px;left:12px;bottom:84px;}}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .22s ease;min-width:240px;border:1px solid rgba(255,255,255,0.08);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* Skeletons & Utilities */
.sk{background:linear-gradient(90deg,#ECEAF9 25%,#F5F3FD 37%,#ECEAF9 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:10px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.divider{height:1px;background:var(--line);}
.hover-lift{transition:transform .18s ease, box-shadow .18s ease;}
.hover-lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.tag-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.pulse-dot{animation:pulseDot 1.8s ease infinite;}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Mobile Bottom Nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;justify-content:space-around;padding:7px 4px 9px;z-index:50;}
@media(max-width:900px){.bottomnav{display:flex;}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted-2);font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px;cursor:pointer;}
.bn-item.active{color:var(--indigo);}

/* Certificate */
.certificate{background:linear-gradient(180deg,#FFFFFF 0%, #FAF8FF 100%);border:2.5px solid #E2DCFA;border-radius:24px;padding:52px 44px;position:relative;overflow:hidden;text-align:center;box-shadow:0 12px 36px -10px rgba(79,61,245,0.12);}
.certificate:before,.certificate:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(79,61,245,0.08),transparent 70%);}
.certificate:before{top:-100px;left:-100px;}
.certificate:after{bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(234,179,8,0.12),transparent 70%);}

/* QR Screen */
.qr-box{width:220px;height:220px;border-radius:20px;background:#fff;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:var(--shadow);}
.grad-text{background:linear-gradient(90deg,var(--indigo),var(--violet) 60%, var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* Quick Role Switcher Pill */
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:all .15s;}
.role-pill:hover{background:#F4F2FD;border-color:var(--indigo);color:var(--indigo);}
.role-pill.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
</style>
</head>

/* =========================================================
   DYNAMIC DATE SYSTEM (Updates Everyday Automatically)
========================================================= */
function getRelativeDate(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function fmtDate(dStr, relative=false) {
  if(!dStr) return '';
  const parts = dStr.split('-');
  if(parts.length < 3) return dStr;
  const dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dt);
  target.setHours(0,0,0,0);
  const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

  const standard = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  if (!relative) return standard;
  if (diffDays === 0) return `Today (${standard})`;
  if (diffDays === 1) return `Tomorrow (${standard})`;
  if (diffDays === -1) return `Yesterday (${standard})`;
  if (diffDays > 1 && diffDays <= 6) return `In ${diffDays} days (${standard})`;
  return standard;
}

function getTodayFormatted() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
}

/* =========================================================
   APPLICATION NAVIGATION STATE (WITH ROBUST HISTORY)
========================================================= */
const state = {
  role: null,           // 'student' | 'organizer' | 'admin' | null
  view: 'landing',
  params: {},
  createStep: 1,
  createDraft: {},
  history: [],          // Navigation stack for "Going Back"
};

function canGoBack() {
  return state.history.length > 0;
}

function go(view, params={}, isBack=false) {
  if (!isBack && (state.view !== view || JSON.stringify(state.params) !== JSON.stringify(params))) {
    state.history.push({
      view: state.view,
      params: JSON.parse(JSON.stringify(state.params)),
      role: state.role
    });
    // Keep reasonable history stack size
    if (state.history.length > 30) state.history.shift();
  }
  state.view = view;
  state.params = params;
  window.scrollTo({top:0, behavior:'instant'});
  render();
}

function goBack() {
  if (state.history.length > 0) {
    const prev = state.history.pop();
    state.view = prev.view;
    state.params = prev.params || {};
    state.role = prev.role;
    window.scrollTo({top:0, behavior:'instant'});
    render();
    toast('Returned to previous page');
  } else {
    // Sensible fallback
    if (state.role === 'student') go('student-dashboard', {}, true);
    else if (state.role === 'organizer') go('organizer-dashboard', {}, true);
    else if (state.role === 'admin') go('admin-dashboard', {}, true);
    else go('landing', {}, true);
  }
}

function toast(msg, iconSvg='check') {
  const host = document.getElementById('toastHost');
  if(!host) return;
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span style="color:var(--cyan);display:flex;align-items:center;">${ic(iconSvg,16)}</span><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .25s ease, transform .25s ease';
    el.style.opacity='0';
    el.style.transform='translateY(6px)';
    setTimeout(()=>el.remove(), 250);
  }, 2600);
}

function getReg(eventId){ return registrations.find(r=>r.eventId===eventId); }
function pct(a,b){ return b > 0 ? Math.round((a/b)*100) : 0; }

}

/* =========================================================
   STUDENT: EXPLORE EVENTS
========================================================= */
let exploreState = {q:'', cat:'all', sort:'upcoming'};

function exploreEvents(){
  let list = events.filter(e=>e.status==='published');
  if(exploreState.cat!=='all') list = list.filter(e=>e.category===exploreState.cat);
  if(exploreState.q) list = list.filter(e=>e.title.toLowerCase().includes(exploreState.q.toLowerCase()) || e.dept.toLowerCase().includes(exploreState.q.toLowerCase()));
  if(exploreState.sort==='popular') list = list.sort((a,b)=>b.registered-a.registered);
  else if(exploreState.sort==='closing') list = list.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  else list = list.sort((a,b)=>new Date(a.date)-new Date(b.date));

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <h1 style="font-size:25px;margin:0;font-weight:700;">Explore Events</h1>
    <button class="nav-back-btn" onclick="goBack()">${ic('arrowLeft',14)} <span>Back</span></button>
  </div>
  <p style="color:var(--muted);margin:0 0 20px;font-size:14px;">${list.length} upcoming events verified across campus departments.</p>

  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <div style="flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;">
      ${ic('search',15)}
      <input oninput="exploreState.q=this.value;rerenderRoute()" value="${exploreState.q}" placeholder="Filter by event title, department, speaker…" style="border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;">
    </div>
    <select onchange="exploreState.sort=this.value;rerenderRoute()" style="border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-family:inherit;background:#fff;font-size:13.5px;">
      <option value="upcoming" ${exploreState.sort==='upcoming'?'selected':''}>Upcoming by date</option>
      <option value="popular" ${exploreState.sort==='popular'?'selected':''}>Most registered</option>
      <option value="closing" ${exploreState.sort==='closing'?'selected':''}>Registration closing soon</option>
    </select>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
    ${chip('all','All Events', exploreState.cat==='all')}
    ${CATEGORIES.map(c=>chip(c.id, c.name, exploreState.cat===c.id, c.iconName)).join('')}
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">
    ${list.map(e=>eventCardFull(e)).join('')}
  </div>
  ${list.length===0?emptyState('No matching events found','Try resetting your filters or clearing search terms.','explore','Reset Filters'):''}
  `;
}

function chip(val,label,active,iconName){
  return `<div onclick="exploreState.cat='${val}';rerenderRoute()" class="badge ${active?'badge-indigo':'badge-grey'}" style="cursor:pointer;padding:7px 13px;display:flex;align-items:center;gap:5px;">
    ${iconName ? `<span style="display:flex;">${ic(iconName,13)}</span>`:''}
    <span>${label}</span>
  </div>`;
}

function rerenderRoute(){
  const c = document.querySelector('.content');
  if(c){
    c.innerHTML = routeContent();
    afterRender();
  }
}

function eventCardFull(e){
  const c = catInfo(e.category);
  const p = pct(e.registered,e.capacity);
  const status = p>=100?'CLOSED':p>=85?'ALMOST FULL':'OPEN';
  const statusColor = status==='CLOSED'?'badge-red':status==='ALMOST FULL'?'badge-yellow':'badge-green';
  const reg = getReg(e.id);
  return `
  <div class="card hover-lift" style="overflow:hidden;">
    <div style="height:124px;background:${e.img};position:relative;cursor:pointer;" onclick="go('event-detail',{id:'${e.id}'})">
      <div class="badge" style="position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.92);color:${c.color};">
        <span style="display:flex;">${ic(c.iconName,12)}</span> ${c.name}
      </div>
    </div>
    <div style="padding:16px;">
      <div style="font-weight:600;font-size:15px;margin-bottom:6px;cursor:pointer;line-height:1.3;" onclick="go('event-detail',{id:'${e.id}'})">${e.title}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;flex-direction:column;gap:5px;">
        <div>${ic('cal',13)} &nbsp;${fmtDate(e.date, true)} &bull; ${e.start}</div>
        <div>${ic('pin',13)} &nbsp;${e.venue}</div>
        <div>${ic('users',13)} &nbsp;${e.registered}/${e.capacity} participants</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="badge ${statusColor}">${status}</span>
        ${reg?`<span class="badge badge-green">${ic('check',12)} Registered</span>`:
          `<button class="btn btn-primary btn-sm" ${status==='CLOSED'?'disabled':''} onclick="event.stopPropagation();quickRegister('${e.id}')">Register now</button>`}
      </div>
    </div>
  </div>`;
}

function quickRegister(id){
  const e = events.find(x=>x.id===id);
  if(!e || getReg(id)) return;
  e.registered++;
  registrations.push({eventId:id, status:'confirmed'});
  activityLog.unshift({text:'Registered for '+e.title, time:'Just now'});
  notifications.unshift({id:'n'+Date.now(), icon:'check', text:'Registration confirmed for "'+e.title+'".', time:'Just now', unread:true});
  toast('Registered for '+e.title);
  rerenderRoute();
}

  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:30px;">
    ${upcoming.length?upcoming.map(r=>myEventRow(r)).join(''):emptyState('No active registrations','Discover events happening today or this week.','explore','Browse Calendar')}

function myEventRow(r){
  const e = r.event;
  return `<div class="card hover-lift" style="padding:15px 18px;display:flex;align-items:center;gap:16px;">
    <div style="width:48px;height:48px;border-radius:11px;background:${e.img};flex-shrink:0;"></div>
    <div style="flex:1;min-width:0;cursor:pointer;" onclick="go('event-detail',{id:'${e.id}'})">
      <div style="font-weight:600;font-size:14.5px;">${e.title}</div>
      <div style="font-size:12.5px;color:var(--muted-2);">${fmtDate(e.date, true)} &bull; ${e.venue}</div>
    </div>
    ${r.attended?`<span class="badge badge-green">${ic('check',12)} Attended</span>`:`<span class="badge badge-indigo">Confirmed</span>`}
    ${!r.attended?`<button class="btn btn-outline btn-sm" onclick="go('attendance-scan',{id:'${e.id}'})">${ic('qr',14)} QR Check-In</button>`:''}
    ${r.certIssued?`<button class="btn btn-primary btn-sm" onclick="go('certificate-view',{id:'${e.id}'})">${ic('award',14)} View Certificate</button>`:''}
    ${!r.attended?`<button class="btn btn-danger btn-sm" onclick="cancelReg('${e.id}')">Cancel</button>`:''}
  </div>`;
}

function cancelReg(id){
  const e = events.find(x=>x.id===id);
  registrations = registrations.filter(r=>r.eventId!==id);
  if(e) e.registered = Math.max(0, e.registered-1);
  toast('Registration cancelled', 'check');
  rerenderRoute();
}

  const e = events.find(x=>x.id===state.params.id);

function attendanceConfirmedBlock(e){
  const now = new Date();
  return `
  <div class="card card-pad fade-in" style="text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:#DCFCE7;color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">

    <p style="color:var(--muted);margin:0 0 16px;font-size:13.5px;">
      ${e.title}<br>Verified on ${fmtDate(e.date, true)} at ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
    </p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-primary btn-sm" onclick="go('certificate-view',{id:'${e.id}'})">View Certificate</button>

    </div>
  </div>`;

function simulateScan(id){
  const wrap = document.getElementById('scanWrap');
  wrap.innerHTML = `
    <div style="padding:60px 0;">
      <div class="sk" style="width:60px;height:60px;border-radius:50%;margin:0 auto;"></div>
      <p style="color:var(--muted);margin-top:16px;font-size:13.5px;">Verifying student credentials with venue terminal…</p>
    </div>`;
  setTimeout(()=>{
    const reg = getReg(id);
    if(reg){
      reg.attended = true;
      reg.certIssued = true;
    }
    const e = events.find(x=>x.id===id);
    activityLog.unshift({text:'Attended '+e.title, time:'Just now'});
    notifications.unshift({id:'n'+Date.now(), icon:'award', text:'Certificate unlocked for '+e.title, time:'Just now', unread:true});
    toast('Attendance confirmed & certificate ready!');
    rerenderRoute();
  }, 950);
}

function createNext(fromStep){
  const d = state.createDraft;
  if(fromStep===1){
    d.title = document.getElementById('cf_title').value;
    d.desc = document.getElementById('cf_desc').value;
    d.category = document.getElementById('cf_cat').value;
    d.dept = document.getElementById('cf_dept').value;
    if(!d.title){ toast('Please provide an event title', 'shield'); return; }
  }
  if(fromStep===2){
    d.date = document.getElementById('cf_date').value;
    d.venue = document.getElementById('cf_venue').value;
    d.start = document.getElementById('cf_start').value;
    d.capacity = parseInt(document.getElementById('cf_cap').value)||100;
    d.deadline = document.getElementById('cf_deadline').value;
  }
  state.createStep = fromStep+1;
  rerenderRoute();
}

function newEventFromDraft(status){
  const d = state.createDraft;
  const id = 'e'+(events.length+1)+Math.floor(Math.random()*99);
  events.push({
    id,
    title: d.title||'Untitled Event',
    category: d.category||'tech',
    dept: d.dept||DEPARTMENTS[0],
    desc: d.desc||'',
    img: 'linear-gradient(135deg,#4F3DF5,#17B6C2)',
    date: d.date||getRelativeDate(7),
    start: d.start||'10:00 AM',
    end: '3:00 PM',
    venue: d.venue||VENUES[0].name,
    deadline: d.deadline||getRelativeDate(5),
    capacity: d.capacity||150,
    registered: 0,
    organizer: CURRENT_ORGANIZER.name,
    club: CURRENT_ORGANIZER.club,
    status,
    rating: 0,
    speakers: [],
    schedule: [['10:00','Registration'],['10:30','Keynote Session'],['1:00','Interactive Workshop']]
  });
  state.createDraft = {};
  state.createStep = 1;
  return id;
}

function adminDashboard(){

  return `

    <div>
      <h1 style="font-size:25px;margin:0 0 4px;font-weight:700;">Campus Administration Overview</h1>
      <p style="color:var(--muted);margin:0;font-size:14px;">Institutional oversight, venue allocations, and approval queue for ${getTodayFormatted()}.</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="nav-back-btn" onclick="goBack()">${ic('arrowLeft',14)} <span>Back</span></button>
      <button onclick="go('admin-approvals')" class="btn btn-primary btn-sm">${ic('check',14)} Review Pending (${pending.length})</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
    ${kpiCard('Active Students', '850', ic('users',18), '#4F3DF5')}
    ${kpiCard('Active Events', published, ic('ticket',18), '#17B6C2')}
    ${kpiCard('Campus Registrations', totalReg, ic('chart',18), '#8B5CF6')}
    ${kpiCard('Awaiting Approval', pending.length, ic('clock',18), '#E11D48')}
  </div>

  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:24px;">
    <div class="card card-pad">
      <h3 style="margin:0 0 14px;font-size:15px;">Monthly Event Frequency Trend</h3>
      <canvas id="adminActivityChart" height="170"></canvas>
    </div>
    <div class="card card-pad">
      <h3 style="margin:0 0 14px;font-size:15px;">Events Distributed by Category</h3>
      <canvas id="adminCategoryChart" height="170"></canvas>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;">
    <div class="card card-pad">
      <h3 style="margin:0 0 14px;font-size:15px;">Pending Approval Queue</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${pending.length? pending.map(e=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;">
            <div>
              <div style="font-weight:600;font-size:14px;">${e.title}</div>
              <div style="font-size:12px;color:var(--muted-2);margin-top:2px;">${e.dept} &bull; ${e.organizer} &bull; ${fmtDate(e.date, true)}</div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="go('admin-approvals')">Review &rarr;</button>
          </div>`).join('') : `<div style="color:var(--muted);font-size:13.5px;">All submissions reviewed. No pending approvals today.</div>`}
      </div>
    </div>

    <div class="card card-pad">
      <h3 style="margin:0 0 14px;font-size:15px;">Top Campus Events by Reach</h3>
      ${[...events].sort((a,b)=>b.registered-a.registered).slice(0,4).map((e,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;">
          <div style="width:24px;height:24px;border-radius:50%;background:#EEEBFE;color:var(--indigo-deep);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">${i+1}</div>
          <div style="flex:1;font-size:13.5px;font-weight:500;">${e.title}</div>
          <div style="font-size:12.5px;color:var(--muted-2);">${e.registered} registered</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function drawAdminCharts(){
  Object.values(_charts).forEach(c=>c && c.destroy());
  const ctx1 = document.getElementById('adminActivityChart');
  if(ctx1) _charts.a1 = new Chart(ctx1, {type:'line', data:{labels:['Week 1','Week 2','Week 3','Week 4','Week 5','This Week'], datasets:[{label:'Events',data:[3,6,7,9,12,15],borderColor:'#17B6C2',backgroundColor:'rgba(23,182,194,0.08)',fill:true,tension:0.35}]}, options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EEECFB'}},x:{grid:{display:false}}}}});
  const ctx2 = document.getElementById('adminCategoryChart');
  if(ctx2) _charts.a2 = new Chart(ctx2, {type:'doughnut', data:{labels:CATEGORIES.map(c=>c.name), datasets:[{data:CATEGORIES.map(c=>events.filter(e=>e.category===c.id).length), backgroundColor:CATEGORIES.map(c=>c.color)}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10.5}}}}}});
}

function adminApprovals(){
  const pending = events.filter(e=>e.status==='pending');
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
    <h1 style="font-size:25px;margin:0;font-weight:700;">Event Approvals</h1>
    <button class="nav-back-btn" onclick="goBack()">${ic('arrowLeft',14)} <span>Back</span></button>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    ${pending.length? pending.map(e=>`
      <div class="card card-pad">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:16px;">
          <div>
            <span class="badge badge-indigo" style="margin-bottom:8px;">${catInfo(e.category).name}</span>
            <div style="font-weight:700;font-size:16px;">${e.title}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:4px;">Organized by ${e.organizer} &bull; ${e.dept}</div>
            <div style="font-size:12.5px;color:var(--muted-2);margin-top:6px;">
              ${ic('cal',12)} ${fmtDate(e.date, true)} &bull; ${ic('pin',12)} ${e.venue} &bull; Target Capacity: ${e.capacity}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <button class="btn btn-danger btn-sm" onclick="rejectEvent('${e.id}')">Request Changes</button>
            <button class="btn btn-primary btn-sm" onclick="approveEvent('${e.id}')">Approve & Publish</button>
          </div>
        </div>
      </div>`).join('') : emptyState('Approval queue clear','There are no submissions waiting for review today.','admin-dashboard','Back to Dashboard')}
  </div>`;
}

function approveEvent(id){
  const e = events.find(x=>x.id===id);
  if(e){
    e.status='published';
    toast('Event approved and published to student calendar');
    rerenderRoute();
  }
}

function rejectEvent(id){
  const reason = prompt('Reason for requesting changes (sent to organizer):','Venue schedule conflict. Please choose an alternate slot.');
  if(reason===null) return;
  const e = events.find(x=>x.id===id);
  if(e){
    e.status='rejected';
    e.rejectReason = reason;
    toast('Requested changes from organizer', 'shield');
    rerenderRoute();
  }
}
